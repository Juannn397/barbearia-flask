
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Barber Studio | Agendamento</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px 16px;
            background: #101827;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 760px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 25px 0;
        }

        h1 {
            color: #fbbf24;
            font-size: 38px;
        }

        .subtitulo {
            color: #94a3b8;
        }

        .painel {
            background: #1e293b;
            padding: 28px;
            border-radius: 16px;
        }

        .grade {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            font: inherit;
        }

        .largo {
            grid-column: 1 / -1;
        }

        button {
            margin-top: 24px;
            width: 100%;
            padding: 15px;
            background: #fbbf24;
            border: none;
            border-radius: 9px;
            color: #111827;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .mensagem {
            padding: 14px;
            margin-bottom: 18px;
            background: #334155;
            border-left: 4px solid #fbbf24;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
        }

        a {
            color: #fbbf24;
        }

        @media (max-width: 600px) {
            .grade {
                grid-template-columns: 1fr;
            }

            .painel {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
<main>
    <header>
        <h1>✂ BARBER STUDIO</h1>
        <p class="subtitulo">
            Escolha seu serviço e reserve seu horário.
        </p>
    </header>

    {% for mensagem in get_flashed_messages() %}
        <div class="mensagem">{{ mensagem }}</div>
    {% endfor %}

    <section class="painel">
        <h2>Agendar atendimento</h2>

        <form action="/agendar" method="POST">
            <input type="hidden" name="_csrf" value="{{ csrf }}">

            <div class="grade">

                <div class="largo">
                    <label for="cliente">Seu nome</label>
                    <input
                        id="cliente"
                        name="cliente"
                        maxlength="100"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div>
                    <label for="servico">Escolha o serviço</label>
                    <select id="servico" name="servico" required>
                        {% for nome, preco in servicos.items() %}
                            <option value="{{ nome }}">
                                {{ nome }} — R$ {{ preco }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="barbeiro">Escolha o barbeiro</label>
                    <select id="barbeiro" name="barbeiro" required>
                        {% for barbeiro in barbeiros %}
                            <option value="{{ barbeiro }}">
                                {{ barbeiro }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="data">Data</label>
                    <input
                        id="data"
                        type="date"
                        name="data"
                        min="{{ hoje }}"
                        required
                    >
                </div>

                <div>
                    <label for="horario">Horário</label>
                    <select id="horario" name="horario" required>
                        {% for horario in horarios %}
                            <option value="{{ horario }}">
                                {{ horario }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

            </div>

            <button type="submit">
                Confirmar agendamento
            </button>
        </form>
    </section>

    <footer>
        <p class="subtitulo">
            Projeto demonstrativo desenvolvido com Flask e Supabase.
        </p>
        <a href="/admin">Área administrativa</a>
    </footer>
</main>
</body>
</html>
